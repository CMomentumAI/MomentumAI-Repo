name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Lint ─────────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Build ─────────────────────────────────────────────────────────────────
      # The build validates TypeScript and generates the Next.js standalone output.
      # Env vars are not needed at build time for this project (no static data
      # fetching at build time — everything is server-rendered on demand).
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # ── Tests ─────────────────────────────────────────────────────────────────
      # Tests run fully offline — AWS S3 and all AI providers are mocked.
      # No real API keys are required.
      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          # Auth
          JWT_SECRET: ci-test-jwt-secret-32-characters!
          # AWS (mock values — S3 is mocked in tests)
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_S3_BUCKET_NAME: ci-test-bucket
          AWS_REGION: us-east-1
          # AI services (mock values — all providers are mocked in tests)
          PERPLEXITY_API_KEY: ci-test-perplexity-key
          GEMINI_API_KEY: ci-test-gemini-key
          ELEVENLABS_API_KEY: ci-test-elevenlabs-key
          # Webhook
          OMI_WEBHOOK_SECRET: ci-test-webhook-secret-32chars!!
